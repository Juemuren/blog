<svg xmlns="http://www.w3.org/2000/svg"
  xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
  width="1024" height="1024" viewBox="0 0 700 700"
  fill="none"
>
  <title>Mobius Infinity</title>
  <desc>A Mobius surface twisted into an infinity symbol.</desc>
  <!-- Each closed path is a visible surface patch. -->
  <g id="ribbon" fill="#191919">
    <!-- Rear face, upper right loop, ending at the edge-on twist. -->
    <path id="rear-upper-right" d="
      M 357,296
      C 410,245 461,206 515,203
      C 553,200 584,208 600,222
      C 620,242 631,281 624,318
      C 601,284 564,267 522,267
      C 468,264 417,286 376,315
      Z"/>
    <!-- Right outer fold. The narrow gap beside the rear face is transparent. -->
    <path id="right-fold" d="
      M 616,232
      C 658,263 687,322 679,382
      C 678,393 676,398 671,403
      C 644,430 590,438 521,411
      C 563,409 597,390 616,360
      C 642,320 640,267 616,232
      Z"/>
    <!-- Left returning face. Its upper tip narrows into the ribbon twist. -->
    <path id="left-return" d="
      M 124,282
      C 65,279 31,312 26,356
      C 18,413 55,468 112,488
      C 186,514 270,481 334,421
      L 308,395
      C 261,440 191,449 147,425
      C 103,401 92,351 114,300
      C 117,293 121,287 124,282
      Z"/>
    <!-- Uninterrupted foreground diagonal, flowing into the lower right loop. -->
    <path id="front-diagonal" d="
      M 20,358
      C 20,307 40,263 80,234
      C 126,199 171,195 212,209
      C 266,225 307,256 351,300
      C 402,352 447,397 504,416
      C 567,439 628,444 670,413
      C 646,463 600,491 546,496
      C 470,505 410,470 351,411
      C 302,362 258,310 209,286
      C 154,258 109,262 73,282
      C 42,299 24,324 20,358
      Z"/>
  </g>
</svg>
