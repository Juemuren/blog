{{- .Page.Store.Set "hasTable" true -}}
<table
  {{- range $key, $value := .Attributes -}}
    {{- if $value -}}
      {{- printf " %s=%q" $key $value | safeHTMLAttr -}}
    {{- end -}}
  {{- end -}}>
  <thead>
    {{- range .THead }}
    <tr>
      {{- range . }}
      <th{{ with .Alignment }}{{ printf " style=%q" (printf "text-align: %s" .) | safeHTMLAttr }}{{ end }}>{{ .Text }}</th>
      {{- end }}
    </tr>
    {{- end }}
  </thead>
  <tbody>
    {{- range .TBody }}
    <tr>
      {{- range . }}
      <td{{ with .Alignment }}{{ printf " style=%q" (printf "text-align: %s" .) | safeHTMLAttr }}{{ end }}>{{ .Text }}</td>
      {{- end }}
    </tr>
    {{- end }}
  </tbody>
</table>
