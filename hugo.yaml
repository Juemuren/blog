# https://gohugo.io/configuration/
# https://github.com/adityatelange/hugo-PaperMod/wiki

baseURL: https://juemuren.github.io/blog
locale: zh-cn
title: 无限能指
copyright: "&copy; Copyright 2026, **[Raind](https://github.com/Juemuren)**"
theme: PaperMod
mainSections: ["posts"]

taxonomies:
  category: categories
  tag: tags
  series: series

hasCJKLanguage: true
enableGitInfo: true
googleAnalytics: G-79T7Y2J3Z6

markup:
  goldmark:
    extensions:
      passthrough:
        delimiters:
          block:
          - - $$
            - $$
          inline:
          - - $
            - $
        enable: true

outputFormats:
  llms:
    baseName: llms
    isPlainText: true
    mediaType: text/plain

outputs:
  home:
    - HTML
    - RSS
    - JSON
    - ROBOTS
    - LLMS

services:
  rss:
    limit: -1

caches:
  images:
    dir: :cacheDir/images

languages:
  zh:
    label: 简体中文
    menu:
      main:
        - name: 主页
          url: /
          weight: 10
        - name: 合集
          url: /posts
          weight: 20
        - name: 系列
          url: /series
          weight: 30
        - name: 类别
          url: /categories
          weight: 40
        - name: 标签
          url: /tags
          weight: 50
        - name: 搜索
          url: /search
          weight: 60
        - name: 归档
          url: /archives
          weight: 70
        - name: 关于
          url: /about
          weight: 80
        - name: 仓库
          url: https://github.com/juemuren/blog
          weight: 90

params:
  env: production
  showToc: true
  tocOpen: true
  showFullTextInRSS: false
  showCodeCopyButtons: true
  showShareButtons: false
  showBreadCrumbs: false
  showPostNavLinks: false
  showWordCount: true
  showReadingTime: true
  hideFooter: false

  editPost:
    URL: "https://github.com/Juemuren/blog/tree/main/content"
    Text: "原始文档"
    appendFilePath: true

  author: 冯玉
  description: 冯玉的个人博客
  assets:
    favicon: favicon.svg

  homeInfoParams:
    title: 在逻辑、思辨与诗意间滑动
    content: |
      [数学](categories/数学/) |
      [哲学](categories/哲学/) |
      [计算机科学](categories/计算机科学/) |
      [艺术](categories/艺术/) & [小说](categories/小说/)


  socialIcons:
    - name: github
      url: https://github.com/Juemuren
    - name: zhihu
      url: https://www.zhihu.com/people/yan-xi-2-31
